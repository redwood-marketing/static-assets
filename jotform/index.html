<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
   <script src="./app.js" defer></script>
   <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --jotform--color--accent: var(--wp--preset--color--accent-1, #34E5E2);
            --jotform--color--error: var(--wp--preset--color--error, #e24650);
            --jotform--color--base: var(--wp--preset--color--base, #ffffff);
            --jotform--color--contrast: var(--wp--preset--color--contrast, #000000);
			--jotform--ff--headings: "Archivo", sans-serif;
			--jotform--ff--body: "Roboto", sans-serif;
            --jotform--ff--fields: var(--jotform--ff--headings);
            --jotform--border--radius: .2rem;
            accent-color: var(--jotform--color--accent);
            font-size: var(--wp--preset--font-size--ts-n1, 0.9rem);
            font-family: var(--jotform--ff--body);
			font-size: clamp(55%, 2vmax, 100%);
			line-height: 1.6;
        }
		
		::selection {
			background-color: var(--jotform--color--accent);
		}

		body {
			width: 100%;
			min-height: 100vh;
			padding: 1em;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: opacity .3s ease;

			&:has([v-cloak]) {
				opacity: 0;
			}
		}


        fieldset {
			display: flex;
			flex-flow: column nowrap;
			gap: 1em;
			border: none;
		}

		legend {
			font-size: 1em;
			font-weight: 500;
			width: fit-content;
			padding: 0 1ch;
		}

		

		label {
			user-select: none;
			width: 100%;
			font-family: var(--jotform--ff--fields);

			&:has(+ [required])::after {
				content: "*";
				color: var(--jotform--color--error);
			}
		}
		
		input[type=text],
		input[type=url],
		input[type=email],
		input[type=tel],
		input[type=number],
		input[type=date],
		select,
		textarea {
			font-family: var(--jotform--ff--fields);
			background-color: var(--jotform--color--base);
			color: var(--jotform--color--contrast);
			font-size: 0.9em;
			font-weight: 500;
			display: block;
			width: 100% !important;
			border-radius: var(--jotform--border--radius);
			padding: .8em .6em !important;
			border: 1.5px solid currentColor;
			outline: 1.5px dashed transparent;
			outline-offset: 1.5px;
			line-height: 1.3;

			&:is(:focus, :open) {
				outline-color: currentColor;
			}

			&:is(:user-invalid, .mktoInvalid):not(:focus) {
				border-color: var(--jotform--color--error) !important;
			}

			&:user-valid {
				border-color: var(--jotform--color--accent);
			}

			&::placeholder {
				opacity: .5;
				color: currentColor;
			}
		}


		::picker(select) {
			appearance: base-select;
		}

		select {
			appearance: base-select;
			background-color: var(--jotform--color--base);

			&:not([multiple]) {
				display: flex;
				align-items: center;

				&::picker(select) {
					margin-block: .4em;
					border-radius: var(--jotform--border--radius);
					max-width: 30ch;
				}

				&::picker-icon {
					content: "";
					width: 2ch;
					height: 2ch;
					display: block;
					background: url("data:image/svg+xml;charset=UTF-8,<svg xmlns='http://www.w3.org/2000/svg' version='1.1' height='6.16' width='8.05' viewBox='0 0 115 89'><path d='M114.5 0H0L59.5 88.5L114.5 0Z' fill='currentColor'/></svg>") center no-repeat;
				}

				& selectedcontent {
					white-space: nowrap;
					overflow: hidden;
					text-overflow: ellipsis;
				}

				option {
					padding: 1em;
					white-space: normal;

					&::checkmark {
						content: "";
					}
				}
			}

			&[multiple] {
				scrollbar-width: thin;
				scrollbar-color: var(--jotform--color--accent) color-mix(in srgb, var(--jotform--color--accent) 10%, var(--jotform--color--base));
				max-height: 7lh;

				option {
					color: inherit;
					display: grid;
					gap: .7lh;
					grid-template-areas: "checkbox label";
					place-content: start;
					align-items: center;
					background-color: var(--jotform-color-base);
					cursor: pointer;
					

					&:first-child {
						pointer-events: none;
						margin-bottom: .45lh;
						opacity: 0.6;
					}

					&:not(:first-child) {
						padding: .3em;

						&:checked {
							--jotform--checkbox--color--bg: var(--jotform--color--accent);
						}

						&:hover {
							background-color: color-mix(in srgb, var(--jotform--color--accent) 10%, var(--jotform--color--base));
						}

						&::before, &::after {
							content: "";
							width: 1.2lh;
							height: 1.2lh;
							display: grid;
							place-content: center;
							grid-area: checkbox;
						}

						&::after {
							clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
							background-color: var(--jotform--color--base);
							scale: .5;
						}
				
						&::before {
							background-color: var(--jotform--checkbox--color--bg, var(--jotform--color--base));
							border-radius: 0.25em;
							box-shadow: 0 0 0 1.5px var(--jotform--checkbox--color--bg, currentColor) inset;
						}
					}

					
				}
			}

		}

		

		textarea {
			resize: vertical;
			min-height: 6lh;
		}

		[type=checkbox],
		[type=radio] {
			background-color: #ffffff;
			appearance: none;
			border-radius: 0.2em;
			margin: 0;
			font: inherit;
			color: currentColor;
			width: 1.3em;
			height: 1.3em;
			border: 2px solid currentColor;
			display: grid;
			place-content: center;

			&:focus {
				outline-color: var(--jotform--color--contrast);
				outline-offset: .1em;
			}

			&::before {
				content: "";
				width: 0.65em;
				height: 0.65em;
				box-shadow: inset 1em 1em var(--jotform--color--base);
				clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
			}

			&:checked {
				background-color: var(--jotform--color--accent);
				border-color: var(--jotform--color--accent);
			}
			
		} 

		[type=radio] {
			border-radius: 50%;
		}

		:any-link {
			color: var(--jotform--color--error)
		}

		button {

			&:is([type="submit"], [type="button"], :not(:has(selectedcontent))) {
				appearance: none;
				color: currentColor;
				font-family: var(--jotform--ff--fields);
				background-color: var(--jotform--color--accent);
				border: none;
				padding: 1em 1.7em;
				cursor: pointer;
				transition: background-color .3s ease;
				width: 100%;
				display: flex;
				align-items: center;
				justify-content: center;
				font-weight: 500;
				gap: .5lh;
				font-size: 1rem;

				&:is(:hover, :active, :focus) {
					background-color: color-mix(in srgb, var(--jotform--color--accent) 80%, var(--jotform--color--contrast));
				}
			}
			
		}


		:disabled {
			opacity: 0.6;
			pointer-events: none;
			cursor: not-allowed;
		}

		h1, h2, h3, h4, h5, h6 {
			font-family: var(--jotform--ff--headings);
			text-align: center;
			font-weight: 500;
			text-wrap: balance;
			max-width: 40ch;
            line-height: 1.2;
		}

		h1 {
			font-size: 2.5rem;
		}

		h2 {
			font-size: 1.8rem;
		}

		p {
		}

		[id*=mktoForm] {
			display: flex;
			line-height: 1.2;
			flex-flow: column nowrap;
			gap: .8rem;
			width: 100% !important;
		}

		.mktoFormRow {
			font-weight: 500;

			/* Prevents hidden fields from taking up space */
			&:has([type=hidden]) {
				display: none !important;
			}

			/* Moves HTML block to the end */
			&:has(.mktoHtmlText) {
				order: 1;
				font-size: 0.8em;
				line-height: 1.3;
				text-align: center;
				font-family: unset;
			}
		}

		.mktoButtonRow {
			margin-block: 0.7rem;
			font-family: var(--mkto--font-family--fields);
		}

		.mktoClear,
		.mktoOffset,
		.mktoGutter {
			display: none !important;
		}

		.mktoError {
			color: var(--jotform--color--error);
			font-size: .9em;
			margin-top: .5rem;
		}

		.mktoLabel {
			display: flex;
			gap: .2ch;
			padding-block-end: .7em;
			font-size: 0.8em;
			font-weight: 400;
			text-wrap: balance;
			cursor: pointer;

			&:has( ~ .mktoRequired)::after {
				content: "*";
				color: var(--jotform--color--error);
			}
		}

		.mktoFieldWrap {

			& :is(.mktoRadioList, .mktoCheckboxList) {
				display: flex;
				align-items: center;
				flex-wrap: wrap;

				label {
					padding: .2em 1.5ch .15em 1ch;
					flex: 0 0 auto;
					cursor: pointer;
				}
			}

		}

		.mktoAsterix {
			display: none;
		}

		.mktoInstruction:not(:empty) {
			margin-block-start: .6em;
			display: block;
			font-size: .9em;
			font-weight: 400;
		}

		#app {
            display: flex;
			justify-content: center;
			align-items: center;
			flex-flow: column nowrap;
            gap: 10em;
			width: 100%;
			max-width: 100rem;
			height: 100%;
			overflow-x: hidden;
        }

		.sections {
			max-width: 100%;
			display: grid;
			grid-template-areas: "content";
			place-items: center;
		}

		.section {
			grid-area: content;
			border-radius: calc(var(--jotform--border--radius) * 1.3);
			transition: all .3s ease;
			border: 1px solid color(from currentColor srgb r g b / 0.3);
			width: min(50rem, 100%);
			overflow: hidden;
			box-shadow:
				0 1px 1px hsl(0deg 0% 0% / 0.075),
				0 2px 2px hsl(0deg 0% 0% / 0.075),
				0 4px 4px hsl(0deg 0% 0% / 0.075),
				0 8px 8px hsl(0deg 0% 0% / 0.075),
				0 16px 16px hsl(0deg 0% 0% / 0.075)
			;

			&:has(:user-invalid, .mktoInvalid) {
				border-color: var(--jotform--color--error)
			}

			&:has(:required):not(:has(:invalid)) {
				border-color: var(--jotform--color--accent)
			}

			&.inactive {
				translate: -100%;
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}

			&.active {
				opacity: 1;

				& + .inactive {
					translate: 100%;
				}
			}

		}

		.section__navigation {
			display: flex;
			width: 100%;
			justify-content: center;

			> div {
				width: 100%;
			}
		}

        .section__content {
            display: flex;
			justify-content: center;
			flex-direction: column;
			flex-grow: 1;
			align-items: center;
            gap: 1.5em;
            padding: 4rem 3rem;
			margin-bottom: auto;
        }

		.section__fields {
			width: 100%;
			display: flex;
			gap: 1em;
			//grid-template-columns: repeat(auto-fit, minmax(30ch, 1fr));
			flex-flow: row wrap;
    		align-items: self-end;
		}

		.content {
			display: grid;
			gap: 1em;
		}

		.field {
			width: 100%;
			display: flex;
			flex-flow: column nowrap;
			gap: 0.4em;
			text-align: left;
			flex: 1 1 21rem;
		}

		.question {
			font-size: 1.3rem;
			font-weight: 300;
		}

		.state {
			background-color: #00000022;
			padding: .5em 1em;
			border-radius: var(--jotform--border--radius);
			font-family: var(--jotform--ff--headings);
			position: absolute;
			left: 50%;
			bottom: 0;
			margin: 1em;
			font-weight: 600;
			translate: -50%
		}

		.nav {
			font-size: .7rem;
			position: relative;
			width: 100%;

			&::before {
				content: "";
				height: 2px;
				top: 50%;
				translate: 0 -50%;
				background-color: currentColor;
				display: block;
				left: 0;
				position: absolute;
				width: 100%;
				z-index: -1;
			}

			ul {
				display: flex;
				gap: 1em;
				list-style: none;
				justify-content: space-between;
			}

			li {
				
				&:not(.active) {
					filter: saturate(0) brightness(1.3);
				}
			}

			button {
				border-radius: 50%;
				font-size: inherit;
				aspect-ratio: 1 / 1;
				padding: .1em;
				width: 4ch;
				height: auto;
				display: block;
				box-shadow: 0 0 0 .2rem white;
			}
		}

		.checkboxes {
			display: grid;
			gap: 1em;
			grid-template-columns: repeat(auto-fit, minmax(30ch, 1fr));
			label {
				display: flex;
				gap: 1em;
				border: 2px solid currentColor;
				padding: .7rem;
				border-radius: var(--jotform--border--radius);
				cursor: pointer;
				align-items: baseline;


				input {
					flex: 0 0 auto;
				}

				&:has(:checked) {
					border-color: var(--jotform--color--accent);
					background-color: color-mix(in srgb, var(--jotform--color--accent) 10%, var(--jotform--color--base));
				}
			}
		}

		.debug {
			display: flex;
			flex-flow: column nowrap;
			resize: both;
			gap: 1em;
			position: fixed;
			bottom: 0;
			left: 0;
			margin: 1em;
			border: 1px solid black;
			padding: 2em;
			background: #ffffff00;
			z-index: 5;
			backdrop-filter: blur(10px);
			border-radius: var(--jotform--border--radius);
			font-size: .8rem;
			width: 60rem;
			height: 20lh;
			overflow: scroll;

			& > * {
				text-align: left;
				white-space: pre-line;
			}
		}

   </style>
</head>
<body >
    <div id="app" v-cloak>
		<div class="sections">
			<section class="section" v-if="checkVisibility(section)" v-for="(section, sectionIndex) in registry" :class="(section == selected) ? 'active' : 'inactive'">
				<div class="section__content">
					<h2>{{ section.title }}</h2>
					<div class="content" v-if="section.content" v-html="section.content"></div>
					<span class="question" v-if="section.children?.length > 0">{{section.children?.length}} questions in this section</span>

					
					<div class="section__fields" v-if="section.fields">
						<div class="field" v-for="field in section.fields">
							<label 
								v-if="field.label" 
								:for="field.id"
							>{{ field.label }}</label>

							<select 
								v-if="field.type === 'select'" 
								:name="field.id" 
								:id="field.id" 
								v-model="field.value" 
								:required="field.required"
							>
								<button>
									<selectedcontent></selectedcontent>
								</button>
								<option value="" disabled>Please select</option>
								<option v-for="option in field.options" :key="option" :value="option">
									{{ option }}
								</option>
							</select>
							
							<input 
								v-if="field.type === 'text'" 
								:required="field.required" 
								type="text" 
								:name="field.id" 
								:id="field.id" 
								v-model="field.value"
							>
							
							<fieldset class="checkboxes" v-if="field.type === 'checkboxes'">
								<label v-for="option in field.options" :key="option" :for="toId(option)">
									<input 
										type="checkbox" 
										:name="toId(option)"
										:id="toId(option)" 
										:value="option" 
										v-model="field.value"
									>
									{{ option }}
								</label>
							</fieldset>
								
							<textarea 
								v-if="field.type === 'textarea'" 
								:name="field.id" 
								:id="field.id" 
								v-model="field.value" 
								:required="field.required"
							></textarea>
								
							<input 
								v-if="field.type === 'email'" 
								type="email" 
								:name="field.id" 
								:id="field.id" 
								v-model="field.value" 
								:required="field.required" 
								@input="validate" 
								pattern="^[a-zA-Z0-9]+([._+\-][a-zA-Z0-9]+)*@[a-zA-Z0-9]+([.\-][a-zA-Z0-9]+)*\.[a-zA-Z]{2,}$">
							{{ field.help }}
						</div>
					</div>
				</div>

				<div class="section__navigation" v-if="section.navigation != false"> 
					<div v-if="section.navigation">
						<button v-for="nav in section.navigation" @click="navigate(`${nav.action}`)"  v-html="nav.label" :disabled="!canNavigate">
						</button>
					</div>
					<template v-else>
						<button @click="navigate('prev')"> 
							<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="2ch" fill="currentColor"><path d="M169.4 297.4C156.9 309.9 156.9 330.2 169.4 342.7L361.4 534.7C373.9 547.2 394.2 547.2 406.7 534.7C419.2 522.2 419.2 501.9 406.7 489.4L237.3 320L406.6 150.6C419.1 138.1 419.1 117.8 406.6 105.3C394.1 92.8 373.8 92.8 361.3 105.3L169.3 297.3z"/></svg>
							Previous
						</button>
						<button @click="navigate('next')" :disabled="!canNavigate">
							Next 
							<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="2ch" fill="currentColor"><path d="M439.1 297.4C451.6 309.9 451.6 330.2 439.1 342.7L279.1 502.7C266.6 515.2 246.3 515.2 233.8 502.7C221.3 490.2 221.3 469.9 233.8 457.4L371.2 320L233.9 182.6C221.4 170.1 221.4 149.8 233.9 137.3C246.4 124.8 266.7 124.8 279.2 137.3L439.2 297.3z"/></svg>
						</button>
					</template>
				</div>
			</section>

		</div>

		<span class="state" v-show="!!registry">{{registry?.indexOf(selected)+1}}/{{ registry?.length }}</span>

		<div v-if="testMode" class="debug">
			<h3>Jump to section:</h3>
			<nav class="nav">
				<ul>
					<li v-for="(item, index) in registry" :class="(item == selected) ? 'active' : 'inactive'">
						<button @click="navigate(index)">{{index+1}}</button>
					</li>
				</ul>
			</nav>
			<h3>Thank you page:</h3>
			<a :href="getRedirectURL()" target="_blank">{{getRedirectURL()}}</a>
			
			<h3>Results:</h3>

			<pre>
				{{formatResults().trim()}}
			</pre>

			
		</div>
</div>
</body>
</html>
