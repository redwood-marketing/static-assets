<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/petite-vue@0.4.1/dist/petite-vue.iife.js" defer></script>
   <script src="./app.js" defer></script>
   <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --jotform--color--accent: var(--wp--preset--color--accent-1, #34E5E2);
            --jotform--color--error: var(--wp--preset--color--error, #e24650);
            --jotform--color--base: var(--wp--preset--color--base, #ffffff);
            --jotform--color--contrast: var(--wp--preset--color--contrast, #000000);
			--jotform--ff--headings: "Archivo", sans-serif;
			--jotform--ff--body: "Roboto", sans-serif;
            --jotform--ff--fields: var(--jotform--ff--headings);
            --jotform--border--radius: .2rem;
            accent-color: var(--jotform--color--accent);
            font-size: var(--wp--preset--font-size--ts-n1, 0.9rem);
            font-family: var(--jotform--ff--body);
			font-size: 100%;
			line-height: 1.6;
        }
		
		::selection {
			background-color: var(--jotform--color--accent);
		}

		body {
			width: 100vw;
			height: 100vh;
		}

        fieldset {
			display: flex;
			flex-flow: column nowrap;
			gap: 1em;
			border: none;
		}

		legend {
			font-size: 1em;
			font-weight: 500;
			width: fit-content;
			padding: 0 1ch;
		}

		

		label {
			user-select: none;
			width: 100%;
			font-family: var(--jotform--ff--fields);
		}
		
		input[type=text],
		input[type=url],
		input[type=email],
		input[type=tel],
		input[type=number],
		input[type=date],
		select,
		textarea {
			font-family: var(--jotform--ff--fields);
			background-color: var(--jotform--color--base);
			color: var(--jotform--color--contrast);
			font-size: 0.9em;
			font-weight: 500;
			display: block;
			width: 100% !important;
			border-radius: var(--jotform--border--radius);
			border: 1.5px solid currentColor;
			padding: .8em .6em !important;
			outline: none;

			&:is(:invalid, .mktoInvalid):not(:focus) {
				border-color: var(--jotform--color--error) !important;
			}

			&:focus {
				border-color: var(--jotform--color--accent);
			}

			&::placeholder {
				opacity: .5;
				color: currentColor;
			}
		}

		select {
			appearance: none;
			background-color: var(--jotform--color--base);

			&:not([multiple]) {
				background: url("data:image/svg+xml;charset=UTF-8,<svg xmlns='http://www.w3.org/2000/svg' version='1.1' height='6.16' width='8.05' viewBox='0 0 115 89'><path d='M114.5 0H0L59.5 88.5L114.5 0Z' fill='currentColor'/></svg>") right 2ch center no-repeat;
			}

			&[multiple] {
				scrollbar-width: thin;
				scrollbar-color: var(--jotform--color--accent) color-mix(in srgb, var(--jotform--color--accent) 10%, var(--jotform--color--base));
				max-height: 7lh;
			}

		}

		option {
			color: inherit;
			display: grid;
			gap: .7lh;
			grid-template-areas: "checkbox label";
			place-content: start;
			align-items: center;
			background-color: var(--jotform-color-base);
			cursor: pointer;
			

			&:first-child {
				pointer-events: none;
				margin-bottom: .45lh;
				opacity: 0.6;
			}

			&:not(:first-child) {
				padding: .3em;

				&:checked {
					--jotform--checkbox--color--bg: var(--jotform--color--accent);
				}

				&:hover {
					background-color: color-mix(in srgb, var(--jotform--color--accent) 10%, var(--jotform--color--base));
				}

				&::before, &::after {
					content: "";
					width: 1.2lh;
					height: 1.2lh;
					display: grid;
					place-content: center;
					grid-area: checkbox;
				}

				&::after {
					clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
					background-color: var(--jotform--color--base);
					scale: .5;
				}
		
				&::before {
					background-color: var(--jotform--checkbox--color--bg, var(--jotform--color--base));
					border-radius: 0.25em;
					box-shadow: 0 0 0 1.5px var(--jotform--checkbox--color--bg, currentColor) inset;
				}
			}

			
		}

		textarea {
			resize: vertical;
			min-height: 6lh;
		}

		[type=checkbox],
		[type=radio] {
			background-color: #ffffff;
			appearance: none;
			border-radius: 0.2em;
			margin: 0;
			font: inherit;
			color: currentColor;
			width: 1.3em;
			height: 1.3em;
			border: 2px solid currentColor;
			display: grid;
			place-content: center;

			&:focus {
				outline-color: var(--jotform--color--contrast);
				outline-offset: .1em;
			}

			&::before {
				content: "";
				width: 0.65em;
				height: 0.65em;
				box-shadow: inset 1em 1em var(--jotform--color--base);
				clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
			}

			&:checked {
				background-color: var(--jotform--color--accent);
				border-color: var(--jotform--color--accent);
			}
			
		} 

		[type=radio] {
			border-radius: 50%;
		}

		button {
			appearance: none;
			color: currentColor;
			font-family: var(--jotform--ff--fields);
			background-color: var(--jotform--color--accent);
			border: none;
			padding: 1em 1.7em;
			cursor: pointer;
			transition: background-color .3s ease;
			width: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			font-weight: 500;
			gap: .5lh;
			font-size: 1rem;

			&:is(:hover, :active, :focus) {
				background-color: color-mix(in srgb, var(--jotform--color--accent) 80%, var(--jotform--color--contrast));
			}
		}


		:disabled {
			opacity: 0.6;
			pointer-events: none;
			cursor: not-allowed;
		}

		h1, h2, h3, h4, h5, h6 {
			font-family: var(--jotform--ff--headings);
			text-align: center;
			font-weight: 500;
			text-wrap: balance;
			max-width: 40ch;
            line-height: 1.2;
		}

		h1 {
			font-size: 2.5rem;
		}

		h2 {
			font-size: 1.8rem;
		}

		p {
		}

		#app {
            display: flex;
			justify-content: center;
			align-items: center;
			flex-flow: column nowrap;
            gap: 1em;
			width: 100%;
			height: 100%;
			overflow: hidden;
        }

		.sections {
			max-width: 100%;
			display: grid;
			grid-template-areas: "content";
			place-items: center;
		}

		.section {
			grid-area: content;
			border-radius: calc(var(--jotform--border--radius) * 1.3);
			transition: all .3s ease;
			border: 1px solid color(from currentColor srgb r g b / 0.3);
			width: 50rem;
			overflow: hidden;
			box-shadow:
				0 1px 1px hsl(0deg 0% 0% / 0.075),
				0 2px 2px hsl(0deg 0% 0% / 0.075),
				0 4px 4px hsl(0deg 0% 0% / 0.075),
				0 8px 8px hsl(0deg 0% 0% / 0.075),
				0 16px 16px hsl(0deg 0% 0% / 0.075)
			;

			&.inactive {
				translate: -100%;
				opacity: 0;
			}

			&.active {
				opacity: 1;

				& + .inactive {
					translate: 100%;
				}
			}

		}

		.section__navigation {
			display: flex;
			width: 100%;
			justify-content: center;

			> div {
				width: 100%;
			}
		}

        .section__content {
            display: flex;
			justify-content: center;
			flex-direction: column;
			flex-grow: 1;
			align-items: center;
			text-align: center;
            gap: 1.5em;
            padding: 4rem 3rem;
			margin-bottom: auto;
        }

		.section__fields {
			width: 100%;
			display: grid;
			gap: 1em;
			grid-template-columns: repeat(auto-fit, minmax(30ch, 1fr));
		}

		.content {
			display: grid;
			gap: 1em;
		}

		.field {
			width: 100%;
			display: flex;
			flex-flow: column nowrap;
			gap: 0.4em;
			text-align: left;
		}

		.question {
			font-size: 1.3rem;
			font-weight: 300;
		}

		.checkboxes {
			display: grid;
			gap: 1em;
			grid-template-columns: repeat(auto-fit, minmax(30ch, 1fr));
			label {
				display: flex;
				gap: 1em;
				border: 2px solid currentColor;
				padding: .7rem;
				border-radius: var(--jotform--border--radius);
				cursor: pointer;
				align-items: baseline;


				input {
					flex: 0 0 auto;
				}

				&:has(:checked) {
					border-color: var(--jotform--color--accent);
					background-color: color-mix(in srgb, var(--jotform--color--accent) 10%, var(--jotform--color--base));
				}
			}
		}

   </style>
</head>
<body >
    <div id="app" v-scope @vue:mounted="mounted">
		<div class="sections">
			<section class="section" v-for="section in index" :class="(section == selected) ? 'active' : 'inactive'">
				<div class="section__content">
					<h2>{{ section.title }}</h2>
					<div class="content" v-if="section.content" v-html="section.content"></div>
					<span class="question" v-if="section.children?.length > 0">{{section.children?.length}} questions in this section</span>
					
					<div class="section__fields" v-if="section.fields">
						<div class="field" v-for="field in section.fields">
							<label v-if="field.label" :for="field.name">{{ field.label }}</label>

							<select v-if="field.type === 'select'" :name="field.name" :id="field.name" >
								<option value="">Please select</option>
								<option v-for="option in field.options" :key="option" :value="option">
									{{ option }}
								</option>
							</select>
							
							<input v-if="field.type === 'text'" type="text" :name="field.name" :id="field.name" v-model="field.value">
							
							<fieldset class="checkboxes" v-if="field.type === 'checkboxes'">
								<label v-for="option in field.options" :key="option" :for="toId(option)">
									<input type="checkbox" :name="toId(option)" :id="toId(option)" :value="option">
									{{ option }}
								</label>
							</fieldset>
								
							<textarea v-if="field.type === 'textarea'" :name="field.name" :id="field.name" v-model="field.value"></textarea>
								
							<input v-if="field.type === 'email'" type="email" :name="field.name" :id="field.name" v-model="field.value">
							{{ field.help }}

						</div>
					</div>
				</div>

				<div class="section__navigation" :disabled="!canNavigate"> 
					<div v-if="section.navigation" >
						<button v-for="nav in section.navigation" @click="navigate(`${nav.action}`)"  v-html="nav.label">
						</button>
					</div>
					<template v-else>
						<button @click="navigate('prev')">
							<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="2ch" fill="currentColor"><path d="M169.4 297.4C156.9 309.9 156.9 330.2 169.4 342.7L361.4 534.7C373.9 547.2 394.2 547.2 406.7 534.7C419.2 522.2 419.2 501.9 406.7 489.4L237.3 320L406.6 150.6C419.1 138.1 419.1 117.8 406.6 105.3C394.1 92.8 373.8 92.8 361.3 105.3L169.3 297.3z"/></svg>
							Previous
						</button>
						<button @click="navigate('next')">
							Next 
							<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="2ch" fill="currentColor"><path d="M439.1 297.4C451.6 309.9 451.6 330.2 439.1 342.7L279.1 502.7C266.6 515.2 246.3 515.2 233.8 502.7C221.3 490.2 221.3 469.9 233.8 457.4L371.2 320L233.9 182.6C221.4 170.1 221.4 149.8 233.9 137.3C246.4 124.8 266.7 124.8 279.2 137.3L439.2 297.3z"/></svg>
						</button>
					</template>
				</div>
				
			</section>
			
		</div>
</div>
</body>
</html>
