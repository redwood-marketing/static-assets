    <script>
        (function () {
          window.addEventListener('message', (event) => {
            if (event.origin !== 'https://static.marketing.redwood.com') return;

            if (event.data == "scroll") {
                window.location.hash = '#calendar';
            }

            if (event.data == "iframeResize") {
                document.getElementById('roi-assessment').style.height = event.data.height * 1.02 + 'px';
            }

          });
        
          const base = 'https://ccec-201-252-28-236.ngrok-free.app/roi-assessment/1.0.1/';
          const prefill = sessionStorage.getItem('prefill');
          const src = prefill ? `${base}?prefill=${encodeURIComponent(prefill)}` : base;
        
          const iframe = document.createElement('iframe');
          iframe.id = 'roi-assessment';
          iframe.src = src;
          iframe.frameBorder = '0';
          iframe.style.cssText = 'width: 100%; min-width: 320px; height: 100vh; display: block; margin: 0; padding: 0; overflow: hidden';
        
          document.currentScript.replaceWith(iframe);
        })();
        </script>
        
    <div id="calendar" style="height:100vw">HEH</div>
